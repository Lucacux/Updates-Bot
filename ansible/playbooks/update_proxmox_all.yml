---
# Target compuesto `!update run proxmox`: hypervisor + todos sus guests de una
# sola pasada, sin esperar al barrido diario. Importa los playbooks individuales
# en vez de repetir sus plays: así no hay dos definiciones del mismo update que
# se puedan desincronizar.
#
# El hypervisor va PRIMERO: si el update del host rompe algo, se ve antes de
# empezar a tocar los guests que viven adentro.
- import_playbook: update_proxmox_host.yml
- import_playbook: update_proxmox_debian.yml
- import_playbook: update_alpine.yml
